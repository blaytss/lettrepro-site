<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LettrePro — Autorisation ambassadeur</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.4rem}
.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem 1.6rem;max-width:440px;width:100%;text-align:center}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:.5rem}
h1 span{color:var(--orange)}
p{color:var(--muted);font-size:.95rem;margin-bottom:1rem;line-height:1.5}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.75rem 1.4rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn:disabled{opacity:.55}
.ok{color:var(--green);font-weight:700}.err{color:var(--red);font-weight:700}
.note{font-size:.82rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-top:1rem;text-align:left}
</style>
</head>
<body>
<div class="box" id="box"><p>Chargement…</p></div>
<script>
const API_BASE=window.API_BASE;
const token=new URLSearchParams(location.search).get('token')||'';
const box=document.getElementById('box');
async function api(m,b){const r=await fetch(API_BASE+'/api/ambassadeur/autorisation'+(m==='GET'?'?token='+encodeURIComponent(token):''),{method:m,headers:{'Content-Type':'application/json'},body:m==='POST'?JSON.stringify({token}):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erreur');return d;}
async function init(){
  if(!token){box.innerHTML='<h1>Lien invalide</h1><p>Ce lien d\'autorisation est incomplet.</p>';return;}
  let info;
  try{ info=await api('GET'); }catch(e){ box.innerHTML='<h1>Lien invalide</h1><p>'+e.message+'</p>';return; }
  if(info.deja){ box.innerHTML='<h1>✅ Déjà autorisé</h1><p>Vous avez déjà autorisé la participation de '+(info.enfant||'votre enfant')+'.</p>';return; }
  box.innerHTML=`<h1>Lettre<span>Pro</span> — autorisation</h1>
    <p><b>${info.enfant||'Votre enfant'}</b> souhaite devenir <b>ambassadeur</b> LettrePro : partager l'appli à ses camarades.</p>
    <div class="note">C'est <b>sans rémunération en argent</b> (récompenses non monétaires : goodies, accès premium offert, mise en avant). Aucune donnée d'autres élèves n'est collectée. Vous pouvez retirer votre accord à tout moment en nous écrivant.</div>
    <button class="btn" id="ok" style="margin-top:1rem">J'autorise</button>`;
  document.getElementById('ok').onclick=async()=>{
    document.getElementById('ok').disabled=true;
    try{ const r=await api('POST'); box.innerHTML='<h1 class="ok">✅ Merci !</h1><p>'+(r.message||'Autorisation enregistrée.')+'</p>'; }
    catch(e){ box.innerHTML='<h1 class="err">Erreur</h1><p>'+e.message+'</p>'; }
  };
}
init();
</script>
</body>
</html>
