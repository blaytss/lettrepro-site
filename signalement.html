<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Signaler un problème</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem 1.8rem;max-width:520px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.07)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;margin-bottom:1rem}
.logo span{color:var(--orange)}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.35rem;margin-bottom:.4rem}
p.intro{color:var(--muted);font-size:.9rem;margin-bottom:1.2rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:.9rem 0 .3rem}
select,textarea,input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.7rem .8rem;color:var(--text);font-family:inherit;font-size:.95rem}
textarea{min-height:120px;resize:vertical}
select:focus,textarea:focus,input:focus{outline:none;border-color:var(--orange)}
.btn{width:100%;margin-top:1.1rem;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.8rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6}
.msg{margin-top:.9rem;font-size:.9rem;font-weight:600;display:none}
.msg.ok{color:var(--green);display:block}.msg.err{color:var(--red);display:block}
a.back{display:inline-block;margin-top:1.2rem;color:var(--muted);text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Lettre<span>Pro</span></div>
  <h1>Signaler un problème</h1>
  <p class="intro">Un contenu illicite, un comportement inapproprié, un bug ? Dis-nous tout. On lit chaque signalement. Tu peux rester anonyme.</p>
  <label>Motif</label>
  <select id="motif">
    <option value="">— Choisis un motif —</option>
    <option>Contenu inapproprié ou choquant</option>
    <option>Comportement d'un utilisateur</option>
    <option>Problème avec un contenu généré</option>
    <option>Donnée personnelle / vie privée</option>
    <option>Bug ou problème technique</option>
    <option>Autre</option>
  </select>
  <label>Décris ce qu'il se passe</label>
  <textarea id="details" placeholder="Explique en quelques mots…"></textarea>
  <label>Ton email (facultatif, si tu veux une réponse)</label>
  <input type="email" id="email" placeholder="toi@email.com"/>
  <button class="btn" id="send" onclick="envoyer()">Envoyer le signalement</button>
  <div class="msg" id="msg"></div>
  <a class="back" href="javascript:history.length>1?history.back():location.href='dashboard.html'">← Retour</a>
</div>
<script>
  const API_BASE=window.API_BASE;
  async function envoyer(){
    const motif=document.getElementById('motif').value;
    const details=document.getElementById('details').value.trim();
    const email=document.getElementById('email').value.trim();
    const msg=document.getElementById('msg'), btn=document.getElementById('send');
    msg.className='msg';
    if(!motif){ msg.className='msg err'; msg.textContent='Choisis un motif.'; return; }
    if(details.length<5){ msg.className='msg err'; msg.textContent='Décris un peu plus le problème.'; return; }
    btn.disabled=true; btn.textContent='Envoi…';
    try{
      const r=await fetch(API_BASE+'/api/signalement',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({motif,details,email,url:document.referrer||location.href})});
      const d=await r.json();
      if(!r.ok){ msg.className='msg err'; msg.textContent=d.error||'Erreur, réessaie.'; btn.disabled=false; btn.textContent='Envoyer le signalement'; return; }
      document.getElementById('card').innerHTML='<div class="logo">Lettre<span>Pro</span></div><div style="font-size:2.5rem;text-align:center">✅</div><h1 style="text-align:center">Merci</h1><p class="intro" style="text-align:center">Ton signalement a bien été transmis. On le traite au plus vite.</p><p style="text-align:center"><a href="dashboard.html" style="color:var(--orange);font-weight:700;text-decoration:none">Retour à LettrePro</a></p>';
    }catch(e){ msg.className='msg err'; msg.textContent='Serveur injoignable, réessaie.'; btn.disabled=false; btn.textContent='Envoyer le signalement'; }
  }
</script>
</body>
</html>
