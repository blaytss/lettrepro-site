<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Salles de travail</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--orange)}
.nav-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--orange-glow);border:1px solid var(--orange);color:var(--orange);padding:.2rem .6rem;border-radius:999px;margin-left:.5rem}
.back{color:var(--muted);text-decoration:none;font-size:.85rem}
.wrap{max-width:820px;margin:0 auto;padding:2rem 1.3rem 4rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:1.2rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.card h2{font-family:'Sora',sans-serif;font-weight:700;font-size:1.02rem;margin-bottom:.7rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:.5rem 0 .3rem}
input,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;color:var(--text);font-family:inherit;font-size:.92rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.62rem 1.05rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn.small{padding:.4rem .8rem;font-size:.82rem}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn:disabled{opacity:.5;cursor:default}
.quota{font-size:.82rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.55rem .8rem;margin-bottom:.8rem}
.quota b{color:var(--orange)}
.room{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.7rem .9rem;margin-bottom:.55rem}
.room .n{font-weight:700;font-size:.94rem}
.room .m{color:var(--muted);font-size:.78rem}
.tag{font-size:.64rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;text-transform:uppercase}
.tag.pub{background:rgba(34,160,107,.14);color:var(--green)}
.tag.priv{background:var(--orange-glow);color:var(--orange)}
.msg{padding:.7rem 1rem;border-radius:9px;font-size:.88rem;margin-bottom:1rem;display:none}
.msg.ok{background:rgba(34,160,107,.12);border:1px solid rgba(34,160,107,.35);color:var(--green);display:block}
.msg.err{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3);color:var(--red);display:block}
.note{font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem}
.empty{color:var(--muted);font-size:.88rem;padding:.4rem 0}
@media(max-width:560px){nav{padding:1rem 1.1rem}}
</style>
</head>
<body>
<nav><a href="dashboard.html" class="nav-logo">Lettre<span>Pro</span></a><span class="nav-tag">Salles</span><a href="dashboard.html" class="back">← Retour</a></nav>
<div class="wrap">
  <h1>🧑‍🤝‍🧑 Salles de travail</h1>
  <p class="sub">Travaillez ensemble en visio (caméra, micro, partage d'écran) avec un bloc-notes partagé. Publiques ou privées avec un code.</p>
  <div class="msg" id="msg"></div>
  <div id="quota" class="quota">Chargement…</div>

  <div class="card" id="createCard">
    <h2>Créer une salle</h2>
    <label>Nom de la salle</label>
    <input id="nom" placeholder="Révisions Maths – chapitre dérivées" maxlength="80"/>
    <div class="row">
      <div><label>Matière (optionnel)</label><input id="matiere" placeholder="Maths" maxlength="40"/></div>
      <div><label>Visibilité</label>
        <select id="vis"><option value="public">Publique (tout le monde peut rejoindre)</option>
        <option value="prive">Privée (accès par code)</option></select></div>
    </div>
    <button class="btn" id="create" style="margin-top:.8rem">Créer la salle</button>
  </div>

  <div class="card">
    <h2>Rejoindre avec un code</h2>
    <div class="row"><input id="joinCode" placeholder="Code à 6 caractères" maxlength="6" style="text-transform:uppercase"/>
      <button class="btn ghost" id="join" style="flex:0 0 auto">Rejoindre</button></div>
  </div>

  <div class="card"><h2>Salles publiques</h2><div id="pub"><div class="empty">…</div></div></div>
  <div class="card"><h2>Mes salles</h2><div id="mine"><div class="empty">…</div></div></div>
</div>
<script>
const API_BASE=window.API_BASE;
if(!localStorage.getItem('lp_token')) location.href='login.html';
const $=s=>document.querySelector(s), msg=$('#msg');
function flash(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');if(ok)setTimeout(()=>msg.className='msg',4000);}
async function api(m,p,b){const r=await fetch(API_BASE+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('lp_token')},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||('Erreur '+r.status)),{data:d});return d;}
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function loadConfig(){
  const c=await api('GET','/api/rooms/config');
  const q=$('#quota');
  if(c.mineur && !c.autorise){
    q.innerHTML="🔒 Comme tu as moins de 18 ans, un parent doit <b>autoriser les salles de travail</b> depuis son compte parent avant que tu puisses créer ou rejoindre une salle.";
    $('#create').disabled=true; $('#join').disabled=true;
  } else if(c.quota===0){
    q.innerHTML="Ton offre ne permet pas de <b>créer</b> de salle (mais tu peux en rejoindre). Passe à un abonnement supérieur pour en créer.";
    $('#create').disabled=true;
  } else {
    q.innerHTML=`Créations ce mois : <b>${c.utilisees}/${c.quota}</b> — il t'en reste <b>${c.restantes}</b>.`;
    if(c.restantes<=0){$('#create').disabled=true;}
  }
}
async function loadRooms(){
  const d=await api('GET','/api/rooms');
  const P=$('#pub'), M=$('#mine');
  P.innerHTML=(d.publiques||[]).map(r=>roomRow(r,false)).join('')||'<div class="empty">Aucune salle publique pour l\'instant. Crée la première !</div>';
  M.innerHTML=(d.miennes||[]).map(r=>roomRow(r,true)).join('')||'<div class="empty">Tu n\'as pas encore créé de salle.</div>';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const c=b.getAttribute('data-code');location.href='salle.html?id='+b.getAttribute('data-open')+(c?'&code='+c:'');});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{if(!confirm('Fermer définitivement cette salle ?'))return;try{await api('POST','/api/rooms/'+b.getAttribute('data-close')+'/close');loadRooms();}catch(e){flash(e.message,false);}});
}
function roomRow(r,mine){
  const tag=r.visibilite==='prive'?'<span class="tag priv">Privée</span>':'<span class="tag pub">Publique</span>';
  const closed=r.statut==='fermee';
  const info=mine?(r.visibilite==='prive'&&r.code?(' · code <b>'+r.code+'</b>'):''):(' · par '+esc(r.owner_prenom||'?'));
  return `<div class="room"><div><div class="n">${esc(r.nom)} ${tag}${closed?' <span class="tag" style="background:#eee;color:#999">Fermée</span>':''}</div>
    <div class="m">${r.matiere?esc(r.matiere):'Général'}${info}</div></div>
    <div style="display:flex;gap:.4rem">${closed?'':`<button class="btn small" data-open="${r.id}" data-code="${mine&&r.code?r.code:''}">Entrer</button>`}
    ${mine&&!closed?`<button class="btn small ghost" data-close="${r.id}">Fermer</button>`:''}</div></div>`;
}

$('#create').onclick=async()=>{
  const nom=$('#nom').value.trim(); if(!nom)return flash('Donne un nom à ta salle.',false);
  $('#create').disabled=true;
  try{ const r=await api('POST','/api/rooms',{nom,matiere:$('#matiere').value.trim(),visibilite:$('#vis').value});
    location.href='salle.html?id='+r.id+(r.code?'&code='+r.code:'');
  }catch(e){ flash(e.message,false); $('#create').disabled=false; }
};
$('#join').onclick=async()=>{
  const code=$('#joinCode').value.trim().toUpperCase(); if(!code)return flash('Entre un code.',false);
  try{ const r=await api('POST','/api/rooms/join',{code}); location.href='salle.html?id='+r.id+'&code='+code; }
  catch(e){ flash(e.message,false); }
};
async function boot(){
  // Les salles sont une fonctionnalité "contact" : elles peuvent être désactivées au lancement.
  let cfg={};
  try{ cfg=await (await fetch(API_BASE+'/api/auth/config')).json(); }catch(e){}
  if(cfg.salles_enabled===false){
    document.querySelector('.wrap').innerHTML=`<h1>🧑‍🤝‍🧑 Salles de travail</h1>
      <div class="card" style="text-align:center;padding:2rem">
        <div style="font-size:2rem;margin-bottom:.5rem">🚧</div>
        <h2 style="justify-content:center">Bientôt disponible</h2>
        <p style="color:var(--muted);font-size:.92rem;margin-top:.4rem">Les salles de travail entre élèves arrivent prochainement. En attendant, profite des fiches, quiz et de la création de lettre/CV !</p>
        <a class="btn" href="dashboard.html" style="display:inline-block;margin-top:1rem;text-decoration:none">← Retour au tableau de bord</a>
      </div>`;
    return;
  }
  try{await loadConfig();}catch(e){}
  try{await loadRooms();}catch(e){flash(e.message,false);}
}
boot();
</script>
</body>
</html>
