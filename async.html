<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Questions & réponses vidéo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D;--gold:#C08A00}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--orange)}
.nav-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--orange-glow);border:1px solid var(--orange);color:var(--orange);padding:.2rem .6rem;border-radius:999px;margin-left:.5rem}
.back{color:var(--muted);text-decoration:none;font-size:.85rem}
.wrap{max-width:720px;margin:0 auto;padding:2rem 1.3rem 4rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:1.4rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1rem}
.card h2{font-family:'Sora',sans-serif;font-weight:700;font-size:1.02rem;margin-bottom:.8rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:.5rem 0 .3rem}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;color:var(--text);font-family:inherit;font-size:.92rem;margin-bottom:.5rem}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.65rem 1.1rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn.small{padding:.45rem .85rem;font-size:.82rem}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn:disabled{opacity:.55}
.q{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.85rem 1rem;margin-bottom:.6rem}
.q .m{color:var(--muted);font-size:.78rem}
.pill{font-size:.64rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;text-transform:uppercase}
.pill.ouverte{background:var(--orange-glow);color:var(--orange)}
.pill.repondue{background:rgba(34,160,107,.14);color:var(--green)}
.msg{padding:.7rem 1rem;border-radius:9px;font-size:.88rem;margin-bottom:1rem;display:none}
.msg.ok{background:rgba(34,160,107,.12);border:1px solid rgba(34,160,107,.35);color:var(--green);display:block}
.msg.err{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3);color:var(--red);display:block}
video{width:100%;border-radius:10px;background:#000;margin:.5rem 0}
.rec-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:.3rem;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.note{font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem}
</style>
</head>
<body>
<nav><a href="dashboard.html" class="nav-logo">Lettre<span>Pro</span></a><span class="nav-tag" id="roletag">Async</span><a href="#" class="back" id="backlink">← Retour</a></nav>
<div class="wrap">
  <div class="msg" id="msg"></div>
  <div id="root"><p style="color:var(--muted)">Chargement…</p></div>
</div>
<script>
  const API_BASE=window.API_BASE;
  if(!localStorage.getItem('lp_token')) location.href='login.html';
  let isProf=false, profVerifie=false;
  async function api(m,p,b){ const r=await fetch(API_BASE+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('lp_token')},body:b?JSON.stringify(b):undefined}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('Erreur '+r.status)); return d; }
  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function flash(t,ok){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.textContent=t;setTimeout(()=>m.className='msg',4000);}

  async function init(){
    try{ await api('GET','/api/prof/me'); isProf=true; }catch(e){ isProf=false; }
    if(isProf){ try{ const v=await api('GET','/api/prof/verification'); profVerifie=(v.statut==='verifie'); }catch(e){} }
    document.getElementById('backlink').href = isProf?'prof-dashboard.html':'dashboard.html';
    document.getElementById('roletag').textContent = isProf?'Prof · Async':'Async';
    isProf ? renderProf() : renderEleve();
  }

  // ── ÉLÈVE ──
  async function renderEleve(){
    const root=document.getElementById('root');
    let mine={questions:[]}; try{ mine=await api('GET','/api/async/mes'); }catch(e){}
    root.innerHTML=`
      <h1>Pose ta question, un prof te répond en vidéo</h1>
      <p class="sub">Un prof vérifié enregistre une réponse (5 min max). Elle t'est délivrée après contrôle, et une copie va à ton parent.</p>
      <div class="card">
        <h2>➕ Nouvelle question</h2>
        <label>Matière</label><input id="q-matiere" placeholder="Maths, Physique…"/>
        <label>Ta question</label><textarea id="q-texte" placeholder="Explique ce qui te bloque…"></textarea>
        <div class="note" style="margin-bottom:.6rem">🔒 Pas de coordonnées (téléphone, réseaux, adresse) : elles seront bloquées pour ta sécurité.</div>
        <button class="btn" onclick="poser()">Envoyer ma question</button>
      </div>
      <h2 style="font-family:Sora;font-weight:700;font-size:1.05rem;margin:1.4rem 0 .8rem">Mes questions</h2>
      <div id="mine">${(mine.questions||[]).length?mine.questions.map(q=>`
        <div class="q"><div style="display:flex;justify-content:space-between;gap:.6rem;align-items:center"><b>${esc(q.matiere||'Question')}</b><span class="pill ${q.statut}">${q.statut==='repondue'?'Répondu':'En attente'}</span></div>
          <div class="m">${esc(q.texte||'')}</div>
          ${q.video_path?'<div style="margin-top:.5rem"><span class="pill repondue">🎥 Réponse vidéo disponible</span></div>':''}
        </div>`).join(''):'<p style="color:var(--muted);font-size:.9rem">Aucune question pour l\'instant.</p>'}</div>`;
  }
  async function poser(){
    const texte=document.getElementById('q-texte').value.trim();
    if(texte.length<5){ flash('Écris ta question.'); return; }
    try{ await api('POST','/api/async/questions',{texte,matiere:document.getElementById('q-matiere').value.trim()}); flash('Question envoyée ✓',true); renderEleve(); }
    catch(e){ flash(e.message); }
  }

  // ── PROF ──
  async function renderProf(){
    const root=document.getElementById('root');
    if(!profVerifie){
      root.innerHTML=`<h1>Répondre aux questions</h1><div class="card"><p>Ton compte doit être <b>vérifié</b> pour répondre aux questions des élèves.</p><a class="btn" href="prof-verification.html" style="display:inline-block;text-decoration:none;margin-top:.5rem">Vérifier mon compte</a></div>`;
      return;
    }
    let file={questions:[]}; try{ file=await api('GET','/api/async/questions/file'); }catch(e){}
    root.innerHTML=`
      <h1>Questions à répondre</h1>
      <p class="sub">Choisis une question et enregistre une réponse vidéo (5 min max).</p>
      <div id="file">${(file.questions||[]).length?file.questions.map(q=>`
        <div class="q"><div style="display:flex;justify-content:space-between;gap:.6rem;align-items:center"><b>${esc(q.matiere||'Question')}</b><span class="pill ouverte">Ouverte</span></div>
          <div class="m">${esc(q.texte||'')}</div>
          <button class="btn small" style="margin-top:.5rem" onclick="ouvrirRec(${q.id})">🎥 Répondre en vidéo</button>
        </div>`).join(''):'<p style="color:var(--muted);font-size:.9rem">Aucune question ouverte pour le moment.</p>'}</div>
      <div id="rec" style="display:none"></div>`;
  }
  let mediaRecorder, chunks=[], recStart, recTimer, recQid;
  function ouvrirRec(qid){
    recQid=qid;
    const rec=document.getElementById('rec'); rec.style.display='block';
    rec.innerHTML=`<div class="card"><h2>🎥 Réponse vidéo à la question #${qid}</h2>
      <video id="preview" muted playsinline></video>
      <div id="rec-controls"><button class="btn" id="rec-start" onclick="startRec()">● Démarrer l'enregistrement</button>
        <button class="btn ghost" id="rec-stop" onclick="stopRec()" style="display:none"><span class="rec-dot"></span>Arrêter</button></div>
      <div id="rec-after" style="display:none"><video id="recorded" controls playsinline></video>
        <button class="btn" onclick="envoyerRec()">Envoyer la réponse</button>
        <button class="btn ghost" onclick="ouvrirRec(${qid})">Recommencer</button></div>
      <div class="note" style="margin-top:.6rem">La vidéo est contrôlée avant d'être délivrée à l'élève. Aucune coordonnée ne doit y figurer.</div></div>`;
    rec.scrollIntoView({behavior:'smooth'});
  }
  async function startRec(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      const preview=document.getElementById('preview'); preview.srcObject=stream; preview.play();
      chunks=[]; mediaRecorder=new MediaRecorder(stream); recStart=Date.now();
      mediaRecorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop=()=>{ stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunks,{type:'video/webm'}); window._recDur=Math.round((Date.now()-recStart)/1000);
        document.getElementById('rec-controls').style.display='none';
        const after=document.getElementById('rec-after'); after.style.display='block';
        document.getElementById('recorded').src=URL.createObjectURL(blob); };
      mediaRecorder.start();
      document.getElementById('rec-start').style.display='none';
      document.getElementById('rec-stop').style.display='inline-block';
      recTimer=setTimeout(()=>{ if(mediaRecorder&&mediaRecorder.state==='recording') stopRec(); },300000);
    }catch(e){ flash('Caméra/micro indisponible : '+e.message); }
  }
  function stopRec(){ if(mediaRecorder&&mediaRecorder.state==='recording'){ mediaRecorder.stop(); clearTimeout(recTimer); } }
  async function envoyerRec(){
    try{
      // Sandbox : pas de stockage réel — on envoie un chemin factice (en prod : upload vers stockage privé).
      await api('POST','/api/async/questions/'+recQid+'/repondre',{video_path:'rec-'+Date.now()+'.webm', duree_secondes: window._recDur||60});
      flash('Réponse envoyée ✓ (l\'élève et son parent sont notifiés)',true);
      document.getElementById('rec').style.display='none'; renderProf();
    }catch(e){ flash(e.message); }
  }
  init();
</script>
<script src="legal-footer.js"></script>
</body>
</html>
