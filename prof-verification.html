<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Vérification prof</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D;--gold:#C08A00}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--orange)}
.back{color:var(--muted);text-decoration:none;font-size:.85rem}
.wrap{max-width:640px;margin:0 auto;padding:2rem 1.3rem 4rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:1.4rem;line-height:1.5}
.status{border-radius:12px;padding:1rem 1.2rem;font-weight:700;margin-bottom:1.4rem;border:1px solid}
.status.verifie{background:rgba(34,160,107,.12);border-color:rgba(34,160,107,.4);color:var(--green)}
.status.en_cours{background:rgba(192,138,0,.12);border-color:rgba(192,138,0,.4);color:var(--gold)}
.status.non_verifie,.status.refuse,.status.suspendu{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.35);color:var(--red)}
.step{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1rem}
.step .h{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.step.done .n{background:var(--green);color:#fff;border-color:var(--green)}
.step h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem}
.step p{color:var(--muted);font-size:.88rem;line-height:1.5;margin:.2rem 0 .8rem}
.check{color:var(--green);font-weight:700;font-size:.9rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:.5rem 0 .3rem}
input[type=date],input[type=text]{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.6rem .8rem;color:var(--text);font-family:inherit;font-size:.92rem;margin-bottom:.5rem}
.chk{display:flex;gap:.5rem;align-items:flex-start;font-size:.86rem;margin-bottom:.6rem;cursor:pointer;line-height:1.4}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.65rem 1.1rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55}
.msg{padding:.7rem 1rem;border-radius:9px;font-size:.88rem;margin-bottom:1rem;display:none}
.msg.ok{background:rgba(34,160,107,.12);border:1px solid rgba(34,160,107,.35);color:var(--green);display:block}
.msg.err{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3);color:var(--red);display:block}
.note{font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-top:.4rem}
</style>
</head>
<body>
<nav><a href="prof-dashboard.html" class="nav-logo">Lettre<span>Pro</span></a><a href="prof-dashboard.html" class="back">← Mon espace prof</a></nav>
<div class="wrap">
  <h1>🪪 Vérification de ton compte prof</h1>
  <p class="sub">Pour publier des séances, ton compte doit être vérifié : identité, casier judiciaire (bulletin n°3) et attestations. C'est ce qui protège les élèves — et ce qui rassure les parents.</p>
  <div class="msg" id="msg"></div>
  <div id="status-box"></div>
  <div id="steps"></div>
</div>
<script>
  const API_BASE=window.API_BASE;
  if(!localStorage.getItem('lp_token')) location.href='login.html';
  let V={};
  async function api(m,p,b){ const r=await fetch(API_BASE+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('lp_token')},body:b?JSON.stringify(b):undefined}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('Erreur '+r.status)); return d; }
  function flash(t,ok){const m=document.getElementById('msg');m.className='msg '+(ok?'ok':'err');m.textContent=t;setTimeout(()=>m.className='msg',3500);}
  const LABELS={verifie:'✅ Compte vérifié — tu peux publier des séances.',en_cours:'⏳ En cours de vérification — un contrôle humain finalise ton dossier.',non_verifie:'❌ Compte non vérifié — complète les étapes ci-dessous.',refuse:'❌ Dossier refusé — contacte le support.',suspendu:'⛔ Compte suspendu (ex. casier expiré) — renouvelle ton bulletin n°3.'};
  async function load(){
    try{ V=await api('GET','/api/prof/verification'); }catch(e){ document.getElementById('status-box').innerHTML='<div class="status non_verifie">'+e.message+'</div>'; return; }
    const st=V.statut||'non_verifie';
    document.getElementById('status-box').innerHTML='<div class="status '+st+'">'+(LABELS[st]||st)+'</div>';
    render();
  }
  function render(){
    const idOk=!!V.identite_verifiee, b3Ok=!!V.b3_fourni, attOk=!!V.attestation_honneur;
    document.getElementById('steps').innerHTML=`
      <div class="step ${idOk?'done':''}">
        <div class="h"><div class="n">${idOk?'✓':'1'}</div><h3>Vérifier ton identité</h3></div>
        <p>Pièce d'identité + selfie, via notre prestataire sécurisé. On ne stocke pas tes documents.</p>
        ${idOk?'<div class="check">✔ Identité vérifiée</div>':'<button class="btn" onclick="startId()">Vérifier mon identité</button>'}
      </div>
      <div class="step ${b3Ok?'done':''}">
        <div class="h"><div class="n">${b3Ok?'✓':'2'}</div><h3>Casier judiciaire (bulletin n°3)</h3></div>
        <p>Demande-le gratuitement sur <a href="https://casier-judiciaire.justice.gouv.fr" target="_blank" rel="noopener">casier-judiciaire.justice.gouv.fr</a> (moins de 3 mois), puis indique sa date d'émission. On ne conserve pas le document, seulement le résultat et la date.</p>
        ${b3Ok?('<div class="check">✔ Bulletin déclaré — valable jusqu\'au'+((V.b3_expire_le||'').slice(0,10))+'</div>'):`
          <label>Date d'émission du bulletin n°3</label>
          <input type="date" id="b3date"/>
          <button class="btn" onclick="sendB3()">Valider mon bulletin n°3</button>`}
      </div>
      <div class="step ${attOk?'done':''}">
        <div class="h"><div class="n">${attOk?'✓':'3'}</div><h3>Attestations sur l'honneur</h3></div>
        ${attOk?'<div class="check">✔ Attestations enregistrées</div>':`
          <label class="chk"><input type="checkbox" id="att-honneur"/> <span>J'atteste ne faire l'objet d'aucune condamnation ni interdiction d'exercer auprès de mineurs, et je m'engage à ne jamais contacter un élève hors de la plateforme.</span></label>
          <label class="chk"><input type="checkbox" id="att-cumul"/> <span>Si je suis fonctionnaire de l'Éducation nationale : j'ai obtenu l'autorisation de cumul et je m'engage à ne pas donner de cours rémunérés à mes propres élèves.</span></label>
          <button class="btn" onclick="sendAtt()">Enregistrer mes attestations</button>`}
      </div>
      <div class="note">Une fois les 3 étapes complètes, un contrôle humain finalise ta vérification. Tant que ton compte n'est pas vérifié, tu ne peux pas publier de séance.</div>`;
  }
  async function startId(){ try{ const r=await api('POST','/api/prof/verification/identite'); if(r.url){location.href=r.url;return;} flash('Identité vérifiée ✓',true); await load(); }catch(e){ flash(e.message); } }
  async function sendB3(){ const dt=document.getElementById('b3date').value; if(!dt){flash('Indique la date du bulletin.');return;} try{ await api('POST','/api/prof/verification/b3',{date_document:dt}); flash('Bulletin enregistré ✓',true); await load(); }catch(e){ flash(e.message); } }
  async function sendAtt(){ const h=document.getElementById('att-honneur').checked; if(!h){flash('La première attestation est obligatoire.');return;} try{ await api('POST','/api/prof/verification/attestations',{honneur:h,cumul:document.getElementById('att-cumul').checked}); flash('Attestations enregistrées ✓',true); await load(); }catch(e){ flash(e.message); } }
  load();
</script>
<script src="legal-footer.js"></script>
</body>
</html>
