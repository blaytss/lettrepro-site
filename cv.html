<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Créer un CV</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--orange)}
.nav-tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--orange-glow);border:1px solid var(--orange);color:var(--orange);padding:.2rem .6rem;border-radius:999px;margin-left:.5rem}
.back{color:var(--muted);text-decoration:none;font-size:.85rem}
.wrap{max-width:900px;margin:0 auto;padding:2rem 1.3rem 4rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.3rem;grid-column:1/-1}
.sub{color:var(--muted);font-size:.92rem;margin:-.2rem 0 .4rem;grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.2rem}
.card h2{font-family:'Sora',sans-serif;font-weight:700;font-size:1.02rem;margin-bottom:.6rem}
label{display:block;font-size:.76rem;font-weight:600;color:var(--muted);margin:.5rem 0 .25rem}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.55rem .75rem;color:var(--text);font-family:inherit;font-size:.9rem}
textarea{min-height:64px;resize:vertical}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.62rem 1.05rem;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn.small{padding:.38rem .75rem;font-size:.8rem}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn:disabled{opacity:.5;cursor:default}
.msg{padding:.7rem 1rem;border-radius:9px;font-size:.88rem;margin-bottom:.8rem;display:none;grid-column:1/-1}
.msg.ok{background:rgba(34,160,107,.12);border:1px solid rgba(34,160,107,.35);color:var(--green);display:block}
.msg.err{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3);color:var(--red);display:block}
#out{white-space:pre-wrap;font-size:.9rem;line-height:1.55;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;min-height:240px}
.saved{margin-top:.6rem}
.saved .it{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-bottom:1px solid var(--border);padding:.45rem .1rem;font-size:.86rem}
.saved a{color:var(--orange);cursor:pointer;text-decoration:none}
.empty{color:var(--muted);font-size:.86rem}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
@media print{nav,#form,.saved,.msg,.actions{display:none!important}.wrap{display:block}#out{border:0;background:#fff;padding:0}}
</style>
</head>
<body>
<nav><a href="dashboard.html" class="nav-logo">Lettre<span>Pro</span></a><span class="nav-tag">CV</span><a href="dashboard.html" class="back">← Retour</a></nav>
<div class="wrap">
  <h1>📄 Créer un CV</h1>
  <p class="sub">Remplis ce que tu peux — l'IA rédige un CV clair et honnête, adapté à un profil jeune. 1 crédit par génération.</p>
  <div class="msg" id="msg"></div>

  <div class="card" id="form">
    <h2>Tes informations</h2>
    <label>Titre du CV</label><input id="titre" placeholder="CV — stage de seconde"/>
    <label>Objectif / poste visé</label><input id="objectif" placeholder="Stage d'observation en entreprise"/>
    <label>Formation / scolarité</label><textarea id="formation" placeholder="Seconde générale au Lycée…, options…"></textarea>
    <label>Expériences (stages, jobs, bénévolat)</label><textarea id="experiences" placeholder="Baby-sitting, bénévolat, petit job d'été…"></textarea>
    <label>Compétences</label><textarea id="competences" placeholder="Travail en équipe, informatique, rigueur…"></textarea>
    <div style="display:flex;gap:.6rem"><div style="flex:1"><label>Langues</label><input id="langues" placeholder="Anglais B1, Espagnol A2"/></div>
      <div style="flex:1"><label>Centres d'intérêt</label><input id="interets" placeholder="Sport, musique…"/></div></div>
    <label>Coordonnées (optionnel)</label><input id="coordonnees" placeholder="Ville, email, téléphone"/>
    <button class="btn" id="gen" style="margin-top:.9rem">✦ Générer mon CV</button>
  </div>

  <div class="card">
    <h2>Résultat</h2>
    <div id="out" class="empty">Ton CV apparaîtra ici.</div>
    <div class="actions" id="actions" style="display:none;margin-top:.7rem;gap:.4rem">
      <button class="btn small" id="copy">Copier</button>
      <button class="btn small ghost" id="print">Imprimer / PDF</button>
    </div>
    <div class="saved">
      <h2 style="margin-top:1rem;font-size:.92rem">Mes CV</h2>
      <div id="list"><div class="empty">…</div></div>
    </div>
  </div>
</div>
<script>
const API_BASE=window.API_BASE;
if(!localStorage.getItem('lp_token')) location.href='login.html';
const $=s=>document.querySelector(s), msg=$('#msg');
function flash(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'err');if(ok)setTimeout(()=>msg.className='msg',4000);}
async function api(m,p,b){const r=await fetch(API_BASE+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('lp_token')},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Erreur '+r.status));return d;}
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function showCv(text){ const o=$('#out'); o.classList.remove('empty'); o.textContent=text; $('#actions').style.display='flex'; }

$('#gen').onclick=async()=>{
  const body={titre:$('#titre').value,objectif:$('#objectif').value,formation:$('#formation').value,
    experiences:$('#experiences').value,competences:$('#competences').value,langues:$('#langues').value,
    interets:$('#interets').value,coordonnees:$('#coordonnees').value};
  if(!body.objectif && !body.formation) return flash('Renseigne au moins un objectif ou ta formation.',false);
  $('#gen').disabled=true; $('#gen').textContent='Génération…';
  try{ const r=await api('POST','/api/generate-cv',body); showCv(r.cv); flash('CV généré ✓ ('+r.creditsLeft+' crédits restants)',true); loadList(); }
  catch(e){ flash(e.message,false); }
  finally{ $('#gen').disabled=false; $('#gen').textContent='✦ Générer mon CV'; }
};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#out').textContent);$('#copy').textContent='✓ Copié';setTimeout(()=>$('#copy').textContent='Copier',1500);}catch(e){}};
$('#print').onclick=()=>window.print();

async function loadList(){
  try{ const d=await api('GET','/api/cvs'); const L=$('#list');
    L.innerHTML=(d.cvs||[]).map(c=>`<div class="it"><span>${esc(c.titre||'CV')} <span style="color:var(--muted);font-size:.76rem">${(c.created_at||'').slice(0,10)}</span></span>
      <span><a data-open="${c.id}">ouvrir</a> · <a data-del="${c.id}">suppr.</a></span></div>`).join('')||'<div class="empty">Aucun CV enregistré.</div>';
    L.querySelectorAll('[data-open]').forEach(a=>a.onclick=async()=>{const c=await api('GET','/api/cvs/'+a.getAttribute('data-open'));showCv(c.content);window.scrollTo({top:0,behavior:'smooth'});});
    L.querySelectorAll('[data-del]').forEach(a=>a.onclick=async()=>{if(!confirm('Supprimer ce CV ?'))return;await api('DELETE','/api/cvs/'+a.getAttribute('data-del'));loadList();});
  }catch(e){}
}
loadList();
</script>
  <script src="sidebar.js"></script>
</body>
</html>
