<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Salle de travail</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.4rem;border-bottom:1px solid var(--border);background:var(--surface);gap:.6rem;flex-wrap:wrap}
.nav-logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--text)}
.nav-logo span{color:var(--orange)}
.title{font-family:'Sora',sans-serif;font-weight:700;font-size:.98rem}
.title .m{color:var(--muted);font-weight:500;font-size:.78rem}
.back{color:var(--muted);text-decoration:none;font-size:.85rem}
.share{font-size:.78rem;color:var(--muted)}
.share b{color:var(--orange)}
.wrap{max-width:1200px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:1.7fr 1fr;gap:1rem}
.pane{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pane h2{font-family:'Sora',sans-serif;font-weight:700;font-size:.9rem;padding:.7rem .9rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#jitsi{width:100%;height:70vh;min-height:420px;border:0;background:#000}
#notes{flex:1;min-height:420px;border:0;resize:none;padding:.9rem;font-family:'Inter',sans-serif;font-size:.92rem;line-height:1.5;background:var(--surface);color:var(--text);outline:none}
.savest{font-size:.72rem;color:var(--muted);font-weight:500}
.btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:.4rem .8rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.err{max-width:520px;margin:3rem auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem}
.err h1{font-family:'Sora',sans-serif;font-size:1.3rem;margin-bottom:.5rem}
.err p{color:var(--muted);margin-bottom:1rem}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#jitsi{height:52vh}#notes{min-height:240px}}
</style>
</head>
<body>
<nav>
  <a href="salles.html" class="nav-logo">Lettre<span>Pro</span></a>
  <div class="title" id="title">Salle…</div>
  <div class="share" id="share"></div>
  <a href="salles.html" class="back">← Toutes les salles</a>
</nav>
<div id="root"><p style="text-align:center;color:var(--muted);padding:2rem">Chargement de la salle…</p></div>
<script>
const API_BASE=window.API_BASE;
if(!localStorage.getItem('lp_token')) location.href='login.html';
const params=new URLSearchParams(location.search);
const RID=params.get('id'), CODE=params.get('code')||'';
async function api(m,p,b){const r=await fetch(API_BASE+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('lp_token')},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||('Erreur '+r.status)),{status:r.status,data:d});return d;}
const esc=s=>(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const qs=CODE?('?code='+encodeURIComponent(CODE)):'';

function fail(title,text){
  document.getElementById('root').innerHTML=`<div class="err"><h1>${title}</h1><p>${text}</p><a class="btn" href="salles.html">← Retour aux salles</a></div>`;
}

let dirty=false, saveTimer=null, lastServer='';

async function init(){
  if(!RID){ return fail('Salle introuvable','Aucun identifiant de salle.'); }
  let r;
  try{ r=await api('GET','/api/rooms/'+RID+qs); }
  catch(e){
    if(e.data && e.data.raison==='autorisation_parentale') return fail('Autorisation requise','Un parent doit autoriser les salles de travail depuis son compte.');
    if(e.data && e.data.raison==='code') return fail('Salle privée','Il faut le bon code d\'accès pour entrer.');
    if(e.data && e.data.raison==='fermee') return fail('Salle fermée','Cette salle a été fermée par son créateur.');
    return fail('Accès impossible', e.message);
  }
  document.getElementById('title').innerHTML=esc(r.nom)+' <span class="m">'+(r.matiere?esc(r.matiere)+' · ':'')+'par '+esc(r.owner_prenom)+'</span>';
  if(r.is_owner && r.visibilite==='prive' && r.code){
    document.getElementById('share').innerHTML='Code : <b>'+r.code+'</b> <button class="btn ghost" id="cp" style="margin-left:.3rem">Copier</button>';
  }
  document.getElementById('root').innerHTML=`
    <div class="wrap">
      <div class="pane"><h2>Visio &amp; partage d'écran</h2>
        <iframe id="jitsi" allow="camera; microphone; fullscreen; display-capture; autoplay" src="${r.jitsi_room}#config.prejoinPageEnabled=true"></iframe></div>
      <div class="pane"><h2>Bloc-notes partagé <span class="savest" id="savest"></span></h2>
        <textarea id="notes" placeholder="Écrivez ici ensemble… (sauvegarde automatique, visible par tous les membres)">${esc(r.notes)}</textarea></div>
    </div>`;
  lastServer=r.notes||'';
  const cp=document.getElementById('cp');
  if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(r.code);cp.textContent='✓';}catch(e){}};

  const ta=document.getElementById('notes'), st=document.getElementById('savest');
  ta.addEventListener('input',()=>{ dirty=true; st.textContent='modifié…'; clearTimeout(saveTimer); saveTimer=setTimeout(save,1200); });
  async function save(){
    try{ const d=await api('PUT','/api/rooms/'+RID+'/notes'+qs,{notes:ta.value,code:CODE}); dirty=false; lastServer=ta.value;
      st.textContent='enregistré ✓ (par '+d.maj_par+')'; }
    catch(e){ st.textContent='échec sauvegarde'; }
  }
  // Polling : récupère les modifs des autres si on n'est pas en train d'écrire
  setInterval(async()=>{
    if(dirty) return;
    try{ const d=await api('GET','/api/rooms/'+RID+'/notes'+qs);
      if((d.notes||'')!==lastServer && document.activeElement!==ta){ ta.value=d.notes||''; lastServer=d.notes||'';
        st.textContent=d.maj_par?('à jour ✓ (dernière modif : '+d.maj_par+')'):'à jour ✓'; }
    }catch(e){}
  },4000);
}
init();
</script>
</body>
</html>
