<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Autorisation parentale</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2.2rem 2rem;max-width:460px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.4rem;text-align:center;margin-bottom:1.2rem}
.logo span{color:var(--orange)}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:.6rem;text-align:center}
p{color:var(--muted);font-size:.95rem;line-height:1.55;margin-bottom:1rem}
.child{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.8rem 1rem;text-align:center;font-weight:700;margin-bottom:1.1rem}
.info{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;font-size:.85rem;color:var(--muted);line-height:1.5;margin-bottom:1.1rem}
.info b{color:var(--text)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:.6rem 0 .3rem}
input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:.7rem .8rem;color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem}
input:focus{outline:none;border-color:var(--orange)}
.btn{width:100%;margin-top:1rem;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.8rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin-top:.8rem;font-size:.9rem;font-weight:600;text-align:center;display:none}
.msg.err{color:var(--red);display:block}
.center{text-align:center}
.ic{font-size:2.8rem;text-align:center;margin-bottom:.4rem}
.loader{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:var(--orange);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Lettre<span>Pro</span></div>
  <div class="center" id="loading"><div class="loader"></div></div>
  <div id="content" style="display:none"></div>
</div>
<script>
  const API_BASE = window.API_BASE;
  const token = new URLSearchParams(location.search).get('token') || '';
  const content = document.getElementById('content'), loading = document.getElementById('loading');
  let parentExists = false;

  function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fail(t){ loading.style.display='none'; content.style.display='block';
    content.innerHTML = '<div class="ic">⚠️</div><h1>Lien indisponible</h1><p class="center">'+esc(t)+'</p><p class="center"><a href="login.html">Aller à LettrePro</a></p>'; }

  async function load(){
    if(!token){ return fail('Ce lien d\'autorisation est incomplet.'); }
    let d;
    try { const r = await fetch(API_BASE + '/api/parent/confirm?token=' + encodeURIComponent(token)); d = await r.json();
      if(!r.ok) return fail(d.error || 'Lien invalide ou expiré.');
    } catch(e){ return fail('Serveur injoignable, réessayez.'); }
    parentExists = !!d.parent_existe;
    loading.style.display='none'; content.style.display='block';
    content.innerHTML =
      '<h1>Autorisation parentale</h1>' +
      '<div class="child">👦 ' + esc((d.enfant_prenom||'') + ' ' + (d.enfant_nom||'')) + '</div>' +
      '<div class="info"><b>' + esc(d.enfant_prenom||'Votre enfant') + '</b> a moins de 15 ans et souhaite utiliser LettrePro, une application de révision (fiches, résumés et quiz générés par IA).<br><br>' +
      'En autorisant le compte, vous créez aussi <b>votre espace parent</b> pour suivre son travail (temps de révision, progression). ' +
      'Vous pourrez <b>retirer votre accord</b> à tout moment.<br><br>' +
      '👁️ Vous verrez son activité et sa progression, <b>jamais le contenu de ses cours</b> ni ses réponses détaillées.</div>' +
      (parentExists ? '' :
        '<label>Choisissez un mot de passe pour votre espace parent</label><input type="password" id="pw" placeholder="8 caractères minimum"/>') +
      '<button class="btn" id="ok" onclick="confirmer()">Autoriser le compte de mon enfant</button>' +
      '<div class="msg" id="msg"></div>';
  }

  async function confirmer(){
    const btn = document.getElementById('ok'), msg = document.getElementById('msg');
    const pw = parentExists ? '' : (document.getElementById('pw').value || '');
    msg.className = 'msg';
    if(!parentExists && pw.length < 8){ msg.className='msg err'; msg.textContent='Choisissez un mot de passe d\'au moins 8 caractères.'; return; }
    btn.disabled = true; btn.textContent = '...';
    try {
      const r = await fetch(API_BASE + '/api/parent/confirm', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, password: pw }) });
      const d = await r.json();
      if(!r.ok){ msg.className='msg err'; msg.textContent = d.error || 'Une erreur est survenue.'; btn.disabled=false; btn.textContent='Autoriser le compte de mon enfant'; return; }
      if(d.token) localStorage.setItem('lp_token', d.token);
      content.innerHTML = '<div class="ic">✅</div><h1>C\'est confirmé, merci !</h1>' +
        '<p class="center">Le compte de votre enfant est activé et votre espace parent est prêt. ' +
        'Vous recevrez chaque semaine un résumé de son travail.</p>' +
        '<a class="btn" style="display:block;text-align:center;text-decoration:none" href="parent-dashboard.html">Accéder à mon espace parent</a>';
    } catch(e){ msg.className='msg err'; msg.textContent='Serveur injoignable, réessayez.'; btn.disabled=false; btn.textContent='Autoriser le compte de mon enfant'; }
  }
  load();
</script>
</body>
</html>
