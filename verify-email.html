<!DOCTYPE html>
<html lang="fr">
<head>
<script src="config.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>LettrePro — Activation du compte</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="theme-boot.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FEF9F6;--surface:#FFFFFF;--card:#FFF4EE;--border:#FDDCC8;--orange:#E8692A;--orange-light:#F5A462;--orange-glow:rgba(232,105,42,.15);--text:#1C1107;--muted:#8B6E5A;--green:#22A06B;--red:#E5484D}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2.2rem 2rem;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.logo{font-family:'Sora',sans-serif;font-weight:800;font-size:1.4rem;margin-bottom:1.4rem}
.logo span{color:var(--orange)}
.ic{font-size:3rem;margin-bottom:.8rem}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:1.35rem;margin-bottom:.6rem}
p{color:var(--muted);font-size:.95rem;line-height:1.55;margin-bottom:1.4rem}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;border:none;border-radius:10px;padding:.75rem 1.6rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{filter:brightness(1.08)}
.link{display:block;margin-top:1rem;color:var(--muted);font-size:.85rem;text-decoration:none}
.link:hover{color:var(--orange)}
.loader{display:inline-block;width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Lettre<span>Pro</span></div>
  <div class="ic"><span class="loader"></span></div>
  <h1 id="title">Activation en cours…</h1>
  <p id="desc">Un instant, on active ton compte.</p>
  <div id="actions"></div>
</div>
<script>
  const API_BASE = window.API_BASE;
  const token = new URLSearchParams(location.search).get('token') || '';
  const ic = document.querySelector('.ic'), title = document.getElementById('title'),
        desc = document.getElementById('desc'), actions = document.getElementById('actions');

  function show(icon, t, d, html){ ic.textContent = icon; title.textContent = t; desc.textContent = d; actions.innerHTML = html || ''; }

  async function run(){
    if (!token){ show('⚠️', 'Lien invalide', 'Ce lien d\'activation est incomplet. Réessaie depuis l\'email reçu.', '<a class="link" href="login.html">Aller à la connexion</a>'); return; }
    try {
      const res = await fetch(API_BASE + '/api/verify-email', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) });
      const data = await res.json();
      if (!res.ok){
        show('❌', 'Activation impossible', data.error || 'Ce lien est invalide ou a déjà été utilisé.', '<a class="link" href="login.html">Aller à la connexion</a>');
        return;
      }
      if (data.token){
        // Activé : on connecte directement.
        localStorage.setItem('lp_token', data.token);
        show('✅', 'Compte activé !', 'Ton adresse email est confirmée. Bienvenue sur LettrePro 🎉', '<a class="btn" href="dashboard.html">Accéder à mon compte</a>');
      } else {
        show('✅', data.already ? 'Déjà activé' : 'Compte activé !', data.message || 'Tu peux te connecter.', '<a class="btn" href="login.html">Se connecter</a>');
      }
    } catch(e){
      show('⚠️', 'Serveur injoignable', 'Impossible de contacter le serveur. Vérifie qu\'il est bien lancé, puis réessaie.', '<a class="link" href="login.html">Aller à la connexion</a>');
    }
  }
  run();
</script>
</body>
</html>
